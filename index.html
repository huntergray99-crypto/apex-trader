<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>&nbsp;</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:#080c10;color:#c8d8e8;font-family:'IBM Plex Mono',monospace;overflow:hidden;-webkit-tap-highlight-color:transparent;}
/* ---- BLANK GATE (what the public sees) ---- */
#gate{position:fixed;inset:0;background:#080c10;z-index:100;cursor:default;}
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,7,10,0.96);z-index:110;}
#login .box{background:#0d1117;border:1px solid #1e2d3d;border-radius:8px;padding:26px 22px;width:280px;max-width:88vw;text-align:center;}
#login .lk{font-size:22px;margin-bottom:12px;}
#login input{width:100%;background:#131a22;border:1px solid #1e2d3d;color:#c8d8e8;font-family:inherit;font-size:14px;padding:10px;border-radius:4px;outline:none;text-align:center;letter-spacing:0.15em;}
#login input:focus{border-color:#00d084;}
#login button{width:100%;margin-top:10px;background:#00d084;color:#000;border:none;font-family:inherit;font-weight:600;font-size:12px;padding:10px;border-radius:4px;cursor:pointer;letter-spacing:0.1em;}
#login .err{color:#ff4757;font-size:10px;margin-top:9px;min-height:12px;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake 0.3s;}
/* ---- APP ---- */
#app{display:none;flex-direction:column;height:100%;}
#topbar{background:#0d1117;border-bottom:1px solid #1e2d3d;padding:8px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;}
.logo{color:#00d084;font-weight:600;font-size:13px;letter-spacing:0.2em;}
.strip{margin-left:auto;display:flex;gap:14px;font-size:10px;color:#3d5a70;flex-wrap:wrap;}
.up{color:#00d084;}.dn{color:#ff4757;}
#lock{background:#1a2232;border:1px solid #243447;color:#7a9ab5;font-family:inherit;font-size:10px;padding:4px 10px;border-radius:3px;cursor:pointer;}
#statusbar{background:#0a0f18;border-bottom:1px solid #1e2d3d;padding:5px 12px;font-size:9px;color:#3d5a70;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;background:#ff4757;}
.dot.on{background:#00d084;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
#spcx-alert{display:none;background:rgba(0,208,132,0.12);border-bottom:1px solid #00864f;color:#00d084;font-size:11px;font-weight:600;padding:6px 12px;text-align:center;letter-spacing:0.08em;flex-shrink:0;}
#body{display:flex;flex:1;min-height:0;}
#left{width:210px;background:#0d1117;border-right:1px solid #1e2d3d;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
#center{flex:1;display:flex;flex-direction:column;min-width:0;}
#right{width:270px;background:#0d1117;border-left:1px solid #1e2d3d;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.head{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#3d5a70;padding:7px 12px 5px;border-bottom:1px solid #1e2d3d;flex-shrink:0;}
.acct{padding:10px 12px;border-bottom:1px solid #1e2d3d;}
.arow{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;border-bottom:1px dashed #1a2232;}
.albl{color:#3d5a70;font-size:9px;}
.aval{font-weight:600;}
#positions{overflow-y:auto;}
.prow{padding:7px 12px;border-bottom:1px solid #1e2d3d;border-left:2px solid #ffd32a;font-size:10px;}
.psym{font-size:11px;font-weight:600;}
#watchlist{flex:1;overflow-y:auto;}
.wl{padding:7px 12px;border-bottom:1px solid #1e2d3d;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.wl:hover{background:#131a22;}.wl.active{background:#1a2232;border-left:2px solid #00d084;}
.wl-sym{font-size:11px;font-weight:600;}
#chart-hdr{background:#0d1117;border-bottom:1px solid #1e2d3d;padding:8px 12px;display:flex;align-items:baseline;gap:10px;flex-shrink:0;}
#sym-big{font-size:16px;font-weight:600;letter-spacing:0.08em;}
#tv-chart{flex:1;min-height:0;}
#sig{padding:10px 12px;border-bottom:1px solid #1e2d3d;}
#sig-main{font-size:15px;font-weight:600;margin-bottom:3px;color:#3d5a70;}
#sig-sub{font-size:9px;color:#3d5a70;}
#sig-txt{font-size:10px;line-height:1.6;color:#7a9ab5;margin-top:6px;}
#trades{flex:1;overflow-y:auto;}
.trade{padding:7px 12px;border-bottom:1px solid #1e2d3d;font-size:9px;line-height:1.5;}
.trade.b{border-left:2px solid #00d084;}.trade.s{border-left:2px solid #ff4757;}
.tsym{font-size:11px;font-weight:600;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:#1e2d3d;}
@media(max-width:720px){
  #left{display:none;}#right{width:100%;border-left:none;}
  #body{flex-direction:column;}#center{min-height:240px;}
  #right{max-height:46vh;}
}
</style>
</head>
<body>

<!-- Blank page. Double-click (two fast taps) anywhere to reveal the password. -->
<div id="gate"></div>

<div id="login">
  <div class="box">
    <div class="lk">&#128274;</div>
    <input id="pw" type="password" placeholder="password" autocomplete="off" autocapitalize="off">
    <button onclick="tryLogin()">ENTER</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="logo">&#x2B21; APEX</div>
    <div class="strip">
      <span>SPY <span id="spy">—</span></span>
      <span>QQQ <span id="qqq">—</span></span>
      <span>VIX <span id="vix">—</span></span>
    </div>
    <button id="lock" onclick="lock()">&#128274; LOCK</button>
  </div>

  <div id="statusbar">
    <span><span class="dot on" id="d-alp"></span>Alpaca: <span id="s-alp">—</span></span>
    <span>Bot Equity: <span id="s-eq" class="aval">—</span></span>
    <span>Bot Day P&amp;L: <span id="s-pnl">—</span></span>
    <span>Open: <span id="s-open">0</span></span>
    <span style="margin-left:auto;color:#1e2d3d;">paper trading — view only — updates every 20s</span>
  </div>

  <div id="spcx-alert"></div>

  <div id="body">
    <div id="left">
      <div class="head">Account</div>
      <div class="acct">
        <div class="arow"><span class="albl">Bot Equity</span><span class="aval" id="a-eq">—</span></div>
        <div class="arow"><span class="albl">Cash</span><span class="aval" id="a-cash">—</span></div>
        <div class="arow"><span class="albl">Buying Power</span><span class="aval" id="a-bp">—</span></div>
        <div class="arow"><span class="albl">Bot Day P&amp;L</span><span class="aval" id="a-pnl">—</span></div>
      </div>
      <div class="head">Open Positions</div>
      <div id="positions"><div style="padding:10px 12px;font-size:10px;color:#3d5a70;">—</div></div>
      <div class="head">Watchlist</div>
      <div id="watchlist"></div>
    </div>

    <div id="center">
      <div id="chart-hdr">
        <span id="sym-big">—</span>
        <span id="price-big" style="font-size:14px;">—</span>
        <span id="chg-big" style="font-size:10px;">—</span>
      </div>
      <div id="tv-chart"></div>
    </div>

    <div id="right">
      <div class="head">AI Signal</div>
      <div id="sig">
        <div id="sig-main">—</div>
        <div id="sig-sub">Select a ticker.</div>
        <div id="sig-txt"></div>
      </div>
      <div class="head">Live Trade Feed (bot)</div>
      <div id="trades"><div style="padding:10px 12px;font-size:10px;color:#3d5a70;">Loading…</div></div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
// ============================================================================
//  APEX read-only dashboard. NO KEYS LIVE HERE. Every bit of data comes from
//  your Cloudflare vault, which holds the keys + checks your password server-side.
// ============================================================================
const VAULT_URL = "https://apex-vault.huntergray99.workers.dev";
const HOLD = "SPCX";        // long-term hold — kept out of the bot's P&L and feed
let PASS = null;
let curSym = "IONQ";

const WL = ['IONQ','RGTI','QBTS','QUBT','ARQQ','IBM','SMR','NNE','LEU','BWXT','UUUU','DNN','UEC','RKLB','ASTS','LUNR','BA','JOBY','ACHR','PL','NVDA','PLTR','AI','MSFT','GOOGL','LMT','RTX','NOC','GD','KTOS','LHX','HII','LDOS','BAH','DRS','APP','BKSY','AXON','ORCL','TSLA','NBIS','RIOT','UPST','SOFI','NU','QCOM','SNOW','PLUG','RDDT','BE','WULF','NET','MARA','CRWD','KLAC','LRCX'];

// ---- vault call ----
async function vault(action, extra) {
  const r = await fetch(VAULT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ pass: PASS, action: action }, extra || {}))
  });
  if (r.status === 401) throw new Error('unauthorized');
  return r.json();
}

// ---- secret entrance ----
document.getElementById('gate').addEventListener('dblclick', showLogin);
// mobile: two fast taps
let lastTap = 0;
document.getElementById('gate').addEventListener('touchend', function(){
  const now = Date.now();
  if (now - lastTap < 400) showLogin();
  lastTap = now;
});
function showLogin(){
  if (PASS) return;
  document.getElementById('login').style.display = 'flex';
  setTimeout(function(){ document.getElementById('pw').focus(); }, 50);
}
document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

async function tryLogin(){
  PASS = document.getElementById('pw').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = 'checking…';
  try {
    const acct = await vault('account');
    if (acct && acct.status){ enterApp(); }
    else { throw new Error('bad'); }
  } catch(e){
    PASS = null;
    errEl.textContent = 'wrong password';
    const box = document.querySelector('#login .box');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  }
}

function lock(){
  PASS = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'none';
  document.getElementById('pw').value = '';
  document.getElementById('login-err').textContent = '';
}

function enterApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderWL();
  loadChart(curSym);
  scan(curSym);
  refresh();
  refreshStrip();
  if (window._t1) clearInterval(window._t1);
  if (window._t2) clearInterval(window._t2);
  window._t1 = setInterval(function(){ if(PASS) refresh(); }, 20000);
  window._t2 = setInterval(function(){ if(PASS) refreshStrip(); }, 60000);
}

// ---- money helpers ----
function money(n){ return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function signed(n){ return (n>=0?'+$':'-$') + Math.abs(n).toFixed(2); }

// ---- account + positions + trades ----
async function refresh(){
  try {
    const [acct, pos, orders] = await Promise.all([vault('account'), vault('positions'), vault('orders')]);
    renderAccount(acct, pos);
    renderPositions(pos);
    renderTrades(orders);
    document.getElementById('s-alp').textContent = acct.status ? acct.status.toUpperCase() : 'error';
  } catch(e){ document.getElementById('s-alp').textContent = 'offline'; }
}

function renderAccount(acct, pos){
  const list = Array.isArray(pos) ? pos : [];
  const spcx = list.find(function(p){ return p.symbol === HOLD; });
  const spcxMV  = spcx ? parseFloat(spcx.market_value) : 0;
  const spcxDay = spcx ? (parseFloat(spcx.current_price)-parseFloat(spcx.lastday_price))*parseFloat(spcx.qty) : 0;
  const eq = parseFloat(acct.equity), lastEq = parseFloat(acct.last_equity);
  const botEq   = eq - spcxMV;
  const botLast = lastEq - (spcxMV - spcxDay);
  const botDay  = botEq - botLast;
  document.getElementById('a-eq').textContent = money(botEq);
  document.getElementById('a-cash').textContent = money(acct.cash);
  document.getElementById('a-bp').textContent = money(acct.buying_power);
  const p = document.getElementById('a-pnl'); p.textContent = signed(botDay); p.className = 'aval ' + (botDay>=0?'up':'dn');
  document.getElementById('s-eq').textContent = money(botEq);
  const sp = document.getElementById('s-pnl'); sp.textContent = signed(botDay); sp.className = botDay>=0?'up':'dn';
  checkSpcx(spcx);
}

// SPCX stays silent unless it goes green or hits the 1.5x take-profit ($309.09).
function checkSpcx(spcx){
  const el = document.getElementById('spcx-alert');
  if (!spcx){ el.style.display='none'; return; }
  const price = parseFloat(spcx.current_price), entry = 206.06, target = 309.09;
  if (price >= target){
    el.style.display='block';
    el.textContent = '▲ SPCX HIT 1.5x TAKE-PROFIT ($'+price.toFixed(2)+') — SELL SIGNAL';
  } else if (price > entry){
    el.style.display='block';
    el.textContent = '▲ SPCX IS GREEN ($'+price.toFixed(2)+')';
  } else {
    el.style.display='none';
  }
}

function renderPositions(pos){
  const list = (Array.isArray(pos)?pos:[]).filter(function(p){ return p.symbol !== HOLD; });
  document.getElementById('s-open').textContent = list.length;
  const el = document.getElementById('positions');
  if (!list.length){ el.innerHTML = '<div style="padding:10px 12px;font-size:10px;color:#3d5a70;">No open positions.</div>'; return; }
  el.innerHTML = list.map(function(p){
    const upl = parseFloat(p.unrealized_pl);
    return '<div class="prow"><div class="psym">'+p.symbol+' <span style="color:#3d5a70;font-size:9px;">x'+Math.abs(parseFloat(p.qty))+'</span></div>'+
      '<div style="color:#3d5a70;">@ '+parseFloat(p.avg_entry_price).toFixed(2)+' → '+parseFloat(p.current_price).toFixed(2)+
      ' <span class="'+(upl>=0?'up':'dn')+'">'+signed(upl)+'</span></div></div>';
  }).join('');
}

function renderTrades(orders){
  const list = (Array.isArray(orders)?orders:[]).filter(function(o){ return o.symbol!==HOLD && o.filled_at; });
  const el = document.getElementById('trades');
  if (!list.length){ el.innerHTML = '<div style="padding:10px 12px;font-size:10px;color:#3d5a70;">No recent trades.</div>'; return; }
  el.innerHTML = list.slice(0,40).map(function(o){
    const buy = o.side === 'buy';
    const t = new Date(o.filled_at).toLocaleString([], {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const px = o.filled_avg_price ? '@ '+parseFloat(o.filled_avg_price).toFixed(2) : '';
    return '<div class="trade '+(buy?'b':'s')+'"><div class="tsym">'+(buy?'▲':'▼')+' '+o.side.toUpperCase()+' '+o.symbol+
      ' <span style="color:#3d5a70;">x'+parseFloat(o.filled_qty)+'</span></div>'+
      '<div style="color:#3d5a70;">'+t+' '+px+'</div></div>';
  }).join('');
}

// ---- market strip ----
async function refreshStrip(){
  ['SPY','QQQ','VIX'].forEach(async function(sym){
    try { const d = await vault('price', {symbol:sym});
      if (d && d.price) document.getElementById(sym.toLowerCase()).textContent = parseFloat(d.price).toFixed(2);
    } catch(e){}
  });
}

// ---- watchlist + chart ----
function renderWL(){
  document.getElementById('watchlist').innerHTML = WL.map(function(s){
    return '<div class="wl'+(s===curSym?' active':'')+'" data-s="'+s+'" onclick="pick(this.dataset.s)"><span class="wl-sym">'+s+'</span></div>';
  }).join('');
}
function pick(s){ curSym=s; renderWL(); loadChart(s); scan(s); }

let tvWidget=null, tvSymCur=null;
function tvSymbol(s){ return 'NASDAQ:'+s.replace('/','.'); }
function loadChart(s){
  if (typeof TradingView === 'undefined') return;
  const tvSym = tvSymbol(s);
  if (tvWidget && tvSymCur === tvSym) return;
  tvSymCur = tvSym;
  document.getElementById('sym-big').textContent = s;
  document.getElementById('tv-chart').innerHTML = '';
  tvWidget = new TradingView.widget({
    container_id:'tv-chart', symbol:tvSym, interval:'D', autosize:true,
    timezone:'America/New_York', theme:'dark', style:'1', locale:'en',
    hide_side_toolbar:true, allow_symbol_change:false,
    studies:['STD;EMA','STD;Bollinger_Bands','STD;RSI'],
    overrides:{'paneProperties.background':'#080c10','paneProperties.backgroundType':'solid',
      'mainSeriesProperties.candleStyle.upColor':'#00d084','mainSeriesProperties.candleStyle.downColor':'#ff4757',
      'mainSeriesProperties.candleStyle.borderUpColor':'#00d084','mainSeriesProperties.candleStyle.borderDownColor':'#ff4757',
      'mainSeriesProperties.candleStyle.wickUpColor':'#00d084','mainSeriesProperties.candleStyle.wickDownColor':'#ff4757'}
  });
}

// ---- signal panel (quote + simple read) ----
async function scan(s){
  try {
    const q = await vault('quote', {symbol:s});
    if (q && q.close){
      const price = parseFloat(q.close), pct = parseFloat(q.percent_change);
      document.getElementById('price-big').textContent = '$'+price.toFixed(2);
      const ce = document.getElementById('chg-big');
      ce.textContent = (pct>=0?'+':'')+pct.toFixed(2)+'%'; ce.className = pct>=0?'up':'dn';
    }
    const cs = await vault('candles', {symbol:s, interval:'1day', outputsize:60});
    if (cs && cs.values) renderSignal(cs.values.slice().reverse().map(function(v){return {c:+v.close,h:+v.high,l:+v.low,o:+v.open};}));
  } catch(e){}
}
function ema(a,p){var k=2/(p+1),o=[a[0]];for(var i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o;}
function rsiCalc(cl,p){p=p||14;var g=0,l=0;for(var i=1;i<=p;i++){var d=cl[i]-cl[i-1];d>0?g+=d:l-=d;}var ag=g/p,al=l/p,r=[100-100/(1+ag/(al||0.001))];for(var i=p+1;i<cl.length;i++){var d=cl[i]-cl[i-1];ag=(ag*(p-1)+Math.max(0,d))/p;al=(al*(p-1)+Math.max(0,-d))/p;r.push(100-100/(1+ag/(al||0.001)));}return r;}
function renderSignal(cs){
  if (cs.length < 20){ return; }
  const cl = cs.map(function(c){return c.c;});
  const rsi = rsiCalc(cl); const rv = Math.round(rsi[rsi.length-1]||50);
  const e20 = ema(cl,20); const n = cl.length-1;
  const trendUp = cl[n] > e20[n];
  let sig, col, txt;
  if (rv < 30){ sig='OVERSOLD — WATCH LONG'; col='#00d084'; }
  else if (rv > 70){ sig='OVERBOUGHT — CAUTION'; col='#ff4757'; }
  else if (trendUp){ sig='UPTREND'; col='#54a0ff'; }
  else { sig='DOWNTREND'; col='#ffd32a'; }
  document.getElementById('sig-main').textContent = sig;
  document.getElementById('sig-main').style.color = col;
  document.getElementById('sig-sub').textContent = 'RSI '+rv+'  ·  '+(trendUp?'above':'below')+' 20-EMA';
  document.getElementById('sig-txt').textContent = 'Read-only view. Your bot on the Mac makes all trade decisions — this panel is just a reference.';
}
</script>
</body>
</html>
